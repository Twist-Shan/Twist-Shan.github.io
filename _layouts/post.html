---
layout: studio
---
<article class="article shell">
  <header class="article-header reveal">
    <a class="article-back" href="{{ '/blog/' | relative_url }}">← All notes</a>
    <time>{{ page.date | date: '%B %d, %Y' }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}<p>{{ page.tags | join: ' · ' }}</p>{% endif %}
  </header>
  <div class="article-body reveal">{{ content }}</div>
</article>
