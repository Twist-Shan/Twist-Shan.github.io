<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe7">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('liang-theme');
          const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/studio.css' | relative_url }}">
  </head>
  <body class="studio-body page-{{ page.slug | default: 'home' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include studio-header.html %}
    <main id="main">{{ content }}</main>
    {% include studio-footer.html %}
    <script src="{{ '/assets/js/studio.js' | relative_url }}" defer></script>
  </body>
</html>
