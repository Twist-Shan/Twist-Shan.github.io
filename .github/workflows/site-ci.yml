name: Site CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages safe mode
        run: bundle exec jekyll build --safe --trace
      - name: Check published entry points
        run: bundle exec ruby .github/scripts/check-site.rb
