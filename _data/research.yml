# Research page content
#
# To add a project to an existing direction:
# 1. Copy one item beginning with "- id:" under the desired track.
# 2. Give it a unique lowercase kebab-case id.
# 3. Edit its title and description.
# 4. Add zero or more resources in display order, for example:
#      resources:
#        - label: "arXiv"
#          url: "https://arxiv.org/abs/..."
#          kind: arxiv
#    Use resources: [] to hide the resource row.
# 5. Leave advisor name blank to hide the advisor field.
#
# To add a new research direction, copy one complete item under "domains".
# The page template and CSS should not need to change.

domains:
  - id: deep-learning
    number: "R / 01"
    title: "Deep Learning"
    mark: dl
    tracks:
      - label: "DL / Architecture / Recurrent Model"
        projects:
          - id: loop-test-time-training
            draft: false
            title: "Looped Transformer & Test-Time Training"
            description: >-
              We want to study how lightweight test-time parameter updates interact with recurrent-depth computation in looped Transformers, aiming to jointly reduce operator mismatch and finite-iteration error.
            resources: 
              - label: "Code repo"
                url: "https://github.com/Twist-Shan/Loop_Test-Time_Training"            
            advisor:
              name:
              url:

  - id: reinforcement-learning
    number: "R / 02"
    title: "Reinforcement Learning"
    mark: rl
    tracks:
      - label: "RL / Theory / Bandits Theory"
        projects:
          - id: chatbot-arena-ranking
            draft: false
            title: "Beyond Scalar Leaderboards: Adaptive Sampling for Pareto Frontier Identification in Multi-Objective LLM Arenas"
            description: >-
              We study Pareto frontier identification algorithms for evaluating models from human preferences, especially in AI Arena, through binary pairwise-feedback bandits with the Bradley-Terry model and Borda-score successive elimination.
            resources:
              - label: "Code"
                url: "https://github.com/Twist-Shan/Beyond_Scalar_Leaderboards"
            advisor:
              name: "Prof. Zhimei Ren"
              url: "https://zhimeir.github.io/"

  - id: large-language-model
    number: "R / 03"
    title: "Large Language Model"
    mark: llm
    tracks:
      - label: "LLM / Interpretability / Chain-of-Thought Reasoning"
        projects:
          - id: cot-counting-mechanism
            draft: false
            title: "CoT Reasoning Mechanism for Counting"
            description: >-
              We investigate how Chain-of-Thought improves LLMs' counting ability by tracing the mechanism from controlled synthetic tasks on GPT-2-like Transformers to realistic needle-in-a-haystack settings in open-weight large models.
            resources:
              - label: "Synthetic repo"
                url: "https://github.com/Twist-Shan/Synthetic_CoT_NiaH_Count"
              - label: "Realistic repo"
                url: "https://github.com/Twist-Shan/Realistic_CoT_NiaH_Count"
            advisor:
              name: "Prof. Yiqiao Zhong"
              url: "https://pages.stat.wisc.edu/~zhong35/"
    aside:
      before: >-
        We are also interested in the geometry and compression of hidden-state representations; some toy experiments are available in
      link_label: "Hidden State Evaluation"
      link_url: "https://github.com/Twist-Shan/Hidden_State_Evaluation"
      after: "."

  - id: diffusion-language-model
    number: "R / 04"
    title: "Diffusion Language Model"
    mark: dlm
    tracks:
      - label: "DLM / Interpretability / Latent Reasoning"
        projects:
          - id: diffusion-language-model-sudoku
            draft: false
            title: "DLM Reasoning Mechanism for Sudoku"
            description: >-
              We want to study how diffusion language models enable efficient planning and reasoning on tasks such as Sudoku, and how different adaptive decoding orders affect their reasoning behavior.
            resources: 
              - label: "Code repo"
                url: "https://github.com/Twist-Shan/DLM_Reasoning_Interp"    
            advisor: 
              name: "Prof. Song Mei"
              url: "https://www.stat.berkeley.edu/~songmei/"
