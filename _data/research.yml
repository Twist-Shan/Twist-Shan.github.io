# Research page content
#
# To add a project to an existing direction:
# 1. Copy one item beginning with "- id:" under the desired track.
# 2. Give it a unique lowercase kebab-case id.
# 3. Edit its title and description.
# 4. Add zero or more resources in display order, for example:
#      resources:
#        - label: "arXiv"
#          url: "https://arxiv.org/abs/..."
#          kind: arxiv
#    Use resources: [] to hide the resource row.
# 5. Leave advisor name blank to hide the advisor field.
#
# To add a new research direction, copy one complete item under "domains".
# Available marks: dl, rl, llm, dlm, vlm, agent.
# Set domain draft: true to hide the entire direction.
# VLM and Agent below are placeholders: fill the project, then set BOTH
# the domain and project draft flags to false to publish.
# The page template and CSS should not need to change.

domains:
  - id: deep-learning
    number: "R / 01"
    title: "Deep Learning"
    mark: dl
    tracks:
      - label: "DL / Optimizer / Learning Dynamics"
        projects:
          - id: optimizer-dynamics-loop
            draft: false
            title: "Optimizer Learning Dynamics of Recurrent Models"
            description: >-
              We want to study how different optimizers affects the learning dynamics of looped transformers, including outer-loop geometry and inter-loop algorithms.
            resources: 
              - label: "Code Repo"
                url: "https://github.com/Twist-Shan/Loop_Optimizer_Dynamics"

  - id: reinforcement-learning
    number: "R / 02"
    title: "Reinforcement Learning"
    mark: rl
    tracks:
      - label: "RL / Theory / Bandits Theory"
        projects:
          - id: chatbot-arena-ranking
            draft: false
            title: "Beyond Scalar Leaderboards: Adaptive Sampling for Pareto Frontier Identification in Multi-Objective LLM Arenas"
            description: >-
              We develop adaptive sampling algorithms for Pareto frontier identification in multi-objective LLM arenas, using pairwise human preferences and Borda-based successive elimination to identify non-dominated models with provably fewer comparisons.
            resources:
              - label: "arXiv"
                url: ""
                kind: arxiv
              - label: "Reproduction Code"
                url: "https://github.com/Twist-Shan/Beyond_Scalar_Leaderboards"
            advisor:
              name: "Prof. Zhimei Ren"
              url: "https://zhimeir.github.io/"

  - id: large-language-model
    number: "R / 03"
    title: "Large Language Model"
    mark: llm
    tracks:
      - label: "LLM / Interpretability / Chain-of-Thought Reasoning"
        projects:
          - id: cot-counting-mechanism
            draft: false
            title: "Targeted Retrieval, Compact Representations: How CoT Reasoning Improves Long-Context Counting"
            description: >-
              We study how Chain-of-Thought improves long-context counting in LLMs, showing that it shifts retrieval from broad to targeted and enables compact state-tracking representations of an internal counter, from controlled synthetic Transformers to open-weight models.
            resources:
              - label: "arXiv"
                url: ""
                kind: arxiv
              - label: "Reproduction Code"
                url: "https://github.com/Twist-Shan/CoT_NIAH_Counting"
            advisor:
              name: "Prof. Yiqiao Zhong"
              url: "https://pages.stat.wisc.edu/~zhong35/"

  - id: diffusion-language-model
    number: "R / 04"
    title: "Diffusion Language Model"
    mark: dlm
    tracks:
      - label: "DLM / Interpretability / Latent Reasoning"
        projects:
          - id: diffusion-language-model-sudoku
            draft: false
            title: "DLM Reasoning Mechanism for Sudoku"
            description: >-
              We want to study how diffusion language models enable efficient planning and reasoning on tasks such as Sudoku, and how different adaptive decoding orders affect their reasoning behavior.
            resources: 
              - label: "Code Repo"
                url: "https://github.com/Twist-Shan/DLM_Reasoning_Interp"    
            advisor: 
              name: "Prof. Song Mei"
              url: "https://www.stat.berkeley.edu/~songmei/"

  # Reserved direction; hidden until a real project is ready.
  - id: vision-language-model
    number: "R / 05"
    title: "Vision–Language Model"
    mark: vlm
    draft: false
    tracks:
      - label: "VLM / Interpretability / Chain-of-Visual-Thought" # Fill in the research track.
        projects:
          - id: vlm-covt-mechanism # Replace with a unique project id.
            draft: false
            title: "Understanding CoVT reasoning in VLMs" # Fill in the project title.
            description: >-
              We want to study whether chain-of-visual-thought improves VLMs' reasoning ability, how decodable the vision reasoning tokens are, and whether CoVT's visualizations reflect the information VLMs use to answer questions.
            resources: 
              - label: "Code Repo"
                url: "https://github.com/Twist-Shan/understanding_CoVT"


  # Reserved direction; hidden until a real project is ready.
  - id: agent
    number: "R / 06"
    title: "Agent"
    mark: agent
    draft: false
    tracks:
      - label: "Agent / Multi-Agent Systems / Collective Decision-Making" # Fill in the research track.
        projects:
          - id: confidence-agents-consensus # Replace with a unique project id.
            draft: false
            title: "From Confidence to Consensus in LLM Agents" # Fill in the project title.
            description: >-
              We want to study how assigning confidence scores to different agents changes their judgments when evidence and initial opinions remain fixed, and how access to peers' evidence, different personas and different model types affects this influence.
            resources: 
              - label: "Code Repo"
                url: "https://github.com/Twist-Shan/confidence_agents_consensus"