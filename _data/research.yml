# Research page content
#
# To add a project to an existing direction:
# 1. Copy one item beginning with "- id:" under the desired track.
# 2. Give it a unique lowercase kebab-case id.
# 3. Edit its title and description.
# 4. Add zero or more resources in display order, for example:
#      resources:
#        - label: "arXiv"
#          url: "https://arxiv.org/abs/..."
#          kind: arxiv
#    Use resources: [] to hide the resource row.
# 5. Leave advisor name blank to hide the advisor field.
#
# To add a new research direction, copy one complete item under "domains".
# Available marks: dl, rl, llm, dlm, vlm, agent.
# Set domain draft: true to hide the entire direction.
# VLM and Agent below are placeholders: fill the project, then set BOTH
# the domain and project draft flags to false to publish.
# The page template and CSS should not need to change.

domains:
  - id: deep-learning
    number: "R / 01"
    title: "Deep Learning"
    mark: dl
    tracks:
      - label: "DL / Optimization / Muon"
        projects:
          - id: optimizer-muon-comparison
            draft: false
            title: "Theoretical Analysis of Muon and Muon Hyperball"
            description: >-
              We study how Hyperball-constrained updates change the optimization geometry of Muon, focusing on finite-horizon dynamics, curvature, and stability.
            resources: []
            advisor:
              name: "Prof. Yuxin Chen"
              url: "https://yuxinchen2020.github.io/"

  - id: reinforcement-learning
    number: "R / 02"
    title: "Reinforcement Learning"
    mark: rl
    tracks:
      - label: "RL / Bandits Theory / Adaptive Sampling"
        projects:
          - id: chatbot-arena-ranking
            draft: false
            title: "Beyond Scalar Leaderboards: Adaptive Sampling for Pareto Frontier Identification in Multi-Objective LLM Arenas"
            description: >-
              We study fixed-confidence Pareto frontier identification from multi-objective pairwise preferences, develop an adaptive elimination algorithm with instance-dependent upper and minimax lower bounds on sample complexity, and evaluate it on synthetic benchmarks and real-world LLM Arena data.
            resources:
              - label: "arXiv"
                url: ""
                kind: arxiv
              - label: "Blog"
                url: ""
              - label: "Code"
                url: "https://github.com/Twist-Shan/Beyond_Scalar_Leaderboards"
            advisor:
              name: "Prof. Zhimei Ren"
              url: "https://zhimeir.github.io/"

  - id: large-language-model
    number: "R / 03"
    title: "Large Language Models"
    mark: llm
    tracks:
      - label: "LLM / Interpretability / Chain-of-Thought Reasoning"
        projects:
          - id: cot-counting-mechanism
            draft: false
            title: "Targeted Retrieval, Compact Representations: How CoT Reasoning Improves Long-Context Counting"
            description: >-
              We study why Chain-of-Thought reasoning improves long-context counting across modern LLMs. Our mechanistic analysis reveals a shift from one-shot broad retrieval to iterative targeted retrieval, accompanied by more compact internal counter representations.
            resources:
              - label: "arXiv"
                url: "https://arxiv.org/abs/2609.38958"
                kind: arxiv
              - label: "Blog"
                url: "/posts/2026/10/llm-counting/"
              - label: "Code"
                url: "https://github.com/Twist-Shan/CoT_NIAH_Counting"
            advisor:
              name: "Prof. Yiqiao Zhong"
              url: "https://pages.stat.wisc.edu/~zhong35/"

  - id: diffusion-language-model
    number: "R / 04"
    title: "Diffusion Language Models"
    mark: dlm
    tracks:
      - label: "DLM / Interpretability / Latent Reasoning"
        projects:
          - id: dlm-latent-reasoning
            draft: true
            title: "Mechanistic Interpretability of Latent Reasoning in DLMs"
            description: >-
              We study how diffusion language models represent and update latent reasoning states, and how these mechanisms change across architectures and decoding algorithms.              
            resources:
              - label: "Code"
                url: "https://github.com/Twist-Shan/DLM_Reasoning_Interp"
            advisor:
              name: "Prof. Song Mei"
              url: "https://www.stat.berkeley.edu/~songmei/"

  - id: agent
    number: "R / 05"
    title: "Agents"
    mark: agent
    draft: false
    tracks:
      - label: "Agent / Safety / Memory Monitoring"
        projects:
          - id: agent-memory-monitoring
            draft: false
            title: "Memory and Safety Control of LLM Agents"
            description: >-
              We investigate how LLM agents maintain safety-critical information in internal activations and external memory, and whether monitoring these states can detect mistakes, overlooked requirements, or inaccurate success reports in controlled tasks.
            resources: []
            advisor:
              name: "Prof. Yiqiao Zhong"
              url: "https://pages.stat.wisc.edu/~zhong35/"

      - label: "Multi-Agent / Safety / Collusion"
        projects:
          - id: multi-agent-collusion
            draft: false
            title: "Emergent Collusion through Implicit Communication"
            description: >-
              We investigate whether LLM agents with only local information can implicitly transmit complementary facts through ordinary communication, enabling downstream agents to derive potentially unsafe conclusions unknown to any individual sender, without explicit coordination or joint optimization.
            resources: []
            advisor:
              name: "Prof. Yiqiao Zhong"
              url: "https://pages.stat.wisc.edu/~zhong35/"

  - id: vision-language-model
    number: "R / 06"
    title: "Vision–Language Models"
    mark: vlm
    draft: true
    tracks:
      - label: "VLM / Interpretability / Visual Reasoning"
        projects:
          - id: vlm-covt-mechanism
            draft: true
            title: "Mechanistic Interpretability of Visual Reasoning"
            description: >-
              We study whether visual reasoning traces reflect the information VLMs actually use and how intermediate visual states support downstream reasoning.              
            resources:
              - label: "Code"
                url: "https://github.com/Twist-Shan/understanding_CoVT"